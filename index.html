<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>望仙谷优选住宿</title><style>
:root{--blue:#1677ff;--green:#0b8f67;--orange:#ff6b22;--text:#16181d;--muted:#70757d;--bg:#f5f7fa;--line:#eceef2}*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}button{font:inherit;border:0;background:none}.app{max-width:430px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 40px #0001}.top{position:relative;height:255px;overflow:hidden}.hero{width:100%;height:100%;object-fit:cover;filter:saturate(1.05)}.hero:after{content:""}.topbar{position:absolute;left:16px;right:16px;top:12px;display:flex;align-items:center;justify-content:space-between;color:#fff;text-shadow:0 1px 5px #0007;font-weight:700}.loc{font-size:16px}.dots{background:#ffffffdd;color:#333;border-radius:22px;padding:8px 13px;text-shadow:none}.brand{position:absolute;left:20px;bottom:68px;color:#fff;text-shadow:0 2px 8px #0007}.brand .small{font-size:13px;background:#ffffffd9;color:#17604b;display:inline-block;padding:7px 12px;border-radius:18px;text-shadow:none}.brand h1{margin:9px 0 2px;font-size:29px;letter-spacing:1px}.brand p{margin:0;font-size:13px}.search{position:relative;margin:-30px 14px 0;background:#fff;border-radius:18px;box-shadow:0 7px 25px #172b4d18;padding:8px 12px 14px;z-index:3}.tabs{display:flex;gap:22px;height:42px;align-items:center;border-bottom:1px solid #f0f1f3}.tabs button{font-size:15px;color:#666;white-space:nowrap}.tabs .on{font-weight:800;color:#1677ff}.where{padding:13px 2px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.pin{color:#176fe8;font-size:20px}.where b{font-size:16px}.where span{color:#9aa0a8;font-size:15px}.dateRow{display:grid;grid-template-columns:1fr 1fr 48px;border-bottom:1px solid var(--line);padding:14px 2px 11px;gap:10px}.dateCell small,.guest small{display:block;color:#888;font-size:12px;margin-bottom:5px}.dateCell strong{font-size:19px}.dateCell em{font-style:normal;color:#888;font-size:12px;margin-left:5px}.night{text-align:right;font-size:13px;color:#666;padding-top:20px}.guest{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 9px}.guest b{font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.chips span{background:#f4f6f9;padding:8px 11px;border-radius:7px;font-size:12px;white-space:nowrap}.searchBtn{height:48px;width:100%;border-radius:11px;background:var(--blue);color:white;font-weight:800;font-size:18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px}.quick div{background:#fff;border-radius:12px;padding:12px 11px;box-shadow:0 2px 12px #172b4d0b}.quick b{font-size:15px}.quick p{margin:5px 0 0;color:#888;font-size:12px}.section{padding:0 14px 18px}.sectitle{display:flex;justify-content:space-between;align-items:end;margin:4px 0 11px}.sectitle h2{font-size:20px;margin:0}.sectitle span{font-size:12px;color:#888}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.filters span{background:#f5f7fa;padding:8px 12px;border-radius:8px;font-size:12px;white-space:nowrap}.filters .sel{color:#1677ff;background:#eaf2ff}.hotel{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid #eee;cursor:pointer}.hotel img{width:128px;height:104px;object-fit:cover;border-radius:9px}.hotelmain{min-width:0;flex:1}.hotelname{font-size:16px;font-weight:800;line-height:1.25}.rating{margin:6px 0;font-size:12px}.rating b{background:#3f8bea;color:#fff;padding:2px 5px;border-radius:3px}.rating strong{color:#f06a20;margin-left:4px}.hotelmeta{font-size:11px;color:#777;line-height:1.5}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.tags span{font-size:10px;background:#f5f6f8;padding:3px 5px;border-radius:4px;color:#555}.price{text-align:right;margin-top:3px}.price del{font-size:11px;color:#999}.price b{font-size:20px;color:#f35d24}.price i{font-style:normal;font-size:10px;color:#777}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;height:66px;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.bottom button{font-size:11px;color:#666}.bottom .active{color:#1677ff;font-weight:700}.page{display:none}.page.show{display:block}.subbar{height:52px;background:#fff;display:flex;align-items:center;padding:0 14px;gap:12px;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}.subbar .back{font-size:26px}.subbar h3{margin:0;font-size:17px}.searchMini{background:#f5f6f8;border-radius:18px;padding:7px 12px;flex:1;font-size:12px;color:#777}.resultHead{padding:8px 14px;background:#fff}.resultDate{display:flex;align-items:center;gap:9px;background:#f3f7ff;padding:9px 10px;border-radius:8px;font-size:12px}.resultDate b{font-size:13px}.sorts{display:flex;justify-content:space-between;padding:12px 14px 7px;background:#fff}.sorts button{font-size:12px}.sorts .active{color:#1677ff;font-weight:700}.resultPage .hotel{padding:14px}.detailHero{height:275px;position:relative}.detailHero img{width:100%;height:100%;object-fit:cover}.detailBack{position:absolute;left:14px;top:12px;background:#ffffffdd;width:38px;height:38px;border-radius:50%;font-size:22px}.detailCard{margin-top:-22px;position:relative;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px}.detailTitle{display:flex;justify-content:space-between;gap:10px}.detailTitle h2{margin:0;font-size:22px}.detailTitle button{font-size:13px;color:#555}.score{margin:9px 0;font-size:13px}.score b{font-size:20px;color:#e86627}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#f1f8f5;color:#20765d;padding:6px 8px;border-radius:5px;font-size:11px}.distance{color:#777;font-size:12px;margin:12px 0}.infoBox{background:#f7f8fa;border-radius:10px;padding:12px;margin:10px 0}.room{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.room img{width:108px;height:86px;border-radius:8px;object-fit:cover}.roommain{flex:1}.roomname{font-weight:800}.roomdesc{font-size:11px;color:#777;margin:6px 0}.roomprice b{color:#f15f27;font-size:19px}.bookbtn{float:right;background:#0a8f68;color:#fff;border-radius:8px;padding:8px 15px;font-weight:700}.modal{position:fixed;inset:0;background:#0005;z-index:30;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:430px;margin:auto;border-radius:20px 20px 0 0;padding:18px 16px;max-height:78vh;overflow:auto}.sheet h3{margin:0 0 14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.calendar div{padding:8px 0;font-size:12px}.calendar .week{color:#999}.calendar .day{border-radius:8px}.calendar .picked{background:#1677ff;color:#fff}.calendar .muted{color:#bbb}.sheetActions{display:flex;gap:8px;margin-top:14px}.sheetActions button{flex:1;padding:12px;border-radius:10px}.primary{background:#1677ff;color:#fff}.secondary{background:#f2f4f7}.form input,.form select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:7px 0;font-size:14px}.orderCard{margin:12px 14px;background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 12px #00000008}.orderCard .status{float:right;color:#0a8f68}.empty{text-align:center;color:#999;padding:60px 0}.merchant{padding-bottom:30px}.merchant .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}.merchant .stat div{background:#fff;border-radius:12px;padding:12px}.merchant .stat b{font-size:20px}.merchant .panel{margin:0 14px 12px;background:#fff;border-radius:12px;padding:14px}.merchant table{width:100%;border-collapse:collapse;font-size:11px}.merchant td,.merchant th{padding:8px 3px;border-bottom:1px solid #eee;text-align:left}.tinyBtn{background:#eaf2ff;color:#1677ff;border-radius:6px;padding:5px 7px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:12px;display:none;z-index:50}.toast.show{display:block}
</style></head><body><div class="app">
<div id="home" class="page show"></div><div id="results" class="page"></div><div id="detail" class="page"></div><div id="orders" class="page"></div><div id="merchant" class="page"></div>
<div id="calendarModal" class="modal"><div class="sheet"><h3>选择入住日期</h3><div id="cal"></div><div class="sheetActions"><button class="secondary" onclick="closeCal()">取消</button><button class="primary" onclick="applyDates()">确定</button></div></div></div>
<div id="guestModal" class="modal"><div class="sheet"><h3>房间与人数</h3><div class="form"><label>房间数</label><select id="rooms"><option>1间</option><option>2间</option><option>3间</option></select><label>成人</label><select id="adults"><option>1位成人</option><option selected>2位成人</option><option>3位成人</option><option>4位成人</option></select><label>儿童</label><select id="kids"><option>0位儿童</option><option>1位儿童</option><option>2位儿童</option></select></div><button class="searchBtn" onclick="applyGuest()">确定</button></div></div>
<div id="toast" class="toast"></div></div>
<script>
const A='assets/';
const hotels=[
{name:'云水依山民宿',score:'4.9',reviews:328,distance:'1.2km',price:298,old:368,img:'仙谷_1.webp',tags:['山景房','免费接送','含早餐'],desc:'窗前即见青山云海，环境清幽，适合情侣、家庭入住。',rooms:[['山景大床房','28㎡ · 1.8米大床 · 2人入住',328,'仙谷_1.webp'],['山景双床房','32㎡ · 2张1.2米床 · 2人入住',368,'仙谷_3.webp']]},
{name:'山居·望谷民宿',score:'4.8',reviews:256,distance:'1.8km',price:268,old:318,img:'望仙_1.webp',tags:['山景','停车方便','免费接送'],desc:'大面积观景窗，安静舒适，距离景区约5分钟车程。',rooms:[['山景大床房','26㎡ · 1.8米大床 · 2人入住',298,'望仙_1.webp'],['家庭双床房','35㎡ · 2张1.35米床 · 3人入住',358,'望仙_3.webp']]},
{name:'仙谷雅居',score:'4.7',reviews:198,distance:'2.1km',price:248,old:298,img:'仙栖_5.webp',tags:['安静舒适','免费停车','含早餐'],desc:'庭院式民宿，房间宽敞，适合自驾游客。',rooms:[['庭院大床房','25㎡ · 1.8米大床 · 2人入住',268,'仙栖_5.webp'],['亲子家庭房','45㎡ · 1大床+1小床 · 3人入住',428,'仙栖_2.webp']]},
{name:'松风·听谷山景民宿',score:'4.8',reviews:176,distance:'2.6km',price:238,old:288,img:'松风_1.webp',tags:['宽敞空间','智能客控','山景'],desc:'空间宽敞，公共区域舒适，适合朋友结伴。',rooms:[['听谷大床房','30㎡ · 1.8米大床 · 2人入住',258,'松风_1.webp'],['听谷双床房','36㎡ · 2张1.35米床 · 3人入住',328,'松风_3.webp']]},
{name:'溪山归舍',score:'4.6',reviews:142,distance:'3.2km',price:218,old:268,img:'溪山_4.webp',tags:['性价比高','停车方便','近溪流'],desc:'价格友好，房间整洁，适合预算型游客。',rooms:[['舒适大床房','24㎡ · 1.8米大床 · 2人入住',238,'溪山_4.webp']]}
];
let state={inDate:'08月30日',outDate:'08月31日',nights:1,guest:'1间房 2位成人 0儿童'};let pendingIn=30,pendingOut=31;
function img(n){return A+n}function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');window.scrollTo(0,0)}
function bottom(active='home'){return `<div class="bottom"><button class="${active==='home'?'active':''}" onclick="renderHome()">⌂<br>首页</button><button>♡<br>收藏</button><button>▣<br>优惠</button><button class="${active==='orders'?'active':''}" onclick="renderOrders()">▤<br>订单</button></div>`}
function renderHome(){document.getElementById('home').innerHTML=`<div class="top"><img class="hero" src="${img('scenic/01.jpeg')}"><div class="topbar"><div class="loc">● 望仙谷景区附近⌄</div><div class="dots">•••　◉</div></div><div class="brand"><span class="small">🌿 只收录优质住宿</span><h1>望仙谷优选住宿</h1><p>帮你挑过 · 到店更省心</p></div></div><div class="search"><div class="tabs"><button class="on">优选住宿</button><button>民宿</button><button>精品酒店</button><button>景区内</button></div><div class="where" onclick="toast('位置：望仙谷景区附近')"><span class="pin">●</span><b>望仙谷</b><span>景区内/附近住宿</span><span style="margin-left:auto">⌖</span></div><div class="dateRow"><div class="dateCell" onclick="openCal()"><small>入住</small><strong>${state.inDate}</strong><em>周日</em></div><div class="dateCell" onclick="openCal()"><small>退房</small><strong>${state.outDate}</strong><em>周一</em></div><div class="night">共${state.nights}晚</div></div><div class="guest" onclick="openGuest()"><b>${state.guest}</b><span>⌄</span></div><div class="chips"><span>双床房</span><span>景区内</span><span>山景房</span><span>家庭房</span><span>免费接送</span></div><button class="searchBtn" onclick="renderResults()">⌕ 查询优选住宿</button></div><div class="quick"><div><b>景区内精选</b><p>步行可达</p></div><div><b>附近热搜</b><p>2公里内</p></div><div><b>高性价比</b><p>¥200-500</p></div></div><div class="section"><div class="sectitle"><h2>优选住宿</h2><span>只收录真实经营住宿 ›</span></div><div class="filters"><span class="sel">全部</span><span>景区内</span><span>山景房</span><span>免费接送</span><span>含早餐</span></div>${hotels.slice(0,3).map(h=>card(h)).join('')}</div>${bottom('home')}`}
function card(h){return `<div class="hotel" onclick="renderDetail('${h.name}')"><img src="${img(h.img)}"><div class="hotelmain"><div class="hotelname">${h.name}</div><div class="rating"><b>${h.score}</b> <strong>${h.score>=4.8?'超棒':'很好'}</strong>　<span>${h.reviews}条评价</span></div><div class="hotelmeta">距望仙谷景区 ${h.distance} · ${h.desc}</div><div class="tags">${h.tags.map(x=>`<span>${x}</span>`).join('')}</div><div class="price"><del>¥${h.old}</del> <b>¥${h.price}</b><i> 起/晚</i></div></div></div>`}
function renderResults(){document.getElementById('results').innerHTML=`<div class="subbar"><button class="back" onclick="renderHome()">‹</button><div class="searchMini">望仙谷 · ${state.inDate}—${state.outDate} · ${state.guest}</div><button>⌖</button></div><div class="resultHead"><div class="resultDate"><b>望仙谷</b><span>${state.inDate} 入住</span><span>→</span><span>${state.outDate} 退房</span><strong style="margin-left:auto">${state.nights}晚</strong></div></div><div class="sorts"><button class="active">智能排序⌄</button><button>位置距离⌄</button><button>价格/星级⌄</button><button>筛选</button></div><div class="filters" style="padding:6px 14px;background:#fff"><span>景区内</span><span>4.7分以上</span><span>山景房</span><span>免费接送</span><span>双床房</span></div><div class="resultPage">${hotels.map(h=>card(h)).join('')}</div>${bottom('home')}`;page('results')}
function renderDetail(name){let h=hotels.find(x=>x.name===name)||hotels[0];document.getElementById('detail').innerHTML=`<div class="detailHero"><img src="${img(h.img)}"><button class="detailBack" onclick="renderResults()">‹</button></div><div class="detailCard"><div class="detailTitle"><h2>${h.name}</h2><button onclick="toast('已收藏')">♡ 收藏</button></div><div class="score"><b>${h.score}</b>　${h.score>=4.8?'超棒':'很好'}　${h.reviews}条评价</div><div class="pillrow">${h.tags.map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="distance">📍 距望仙谷景区 ${h.distance}　🚗 可咨询接送</div><div class="infoBox"><b>住宿介绍</b><div style="font-size:12px;color:#666;margin-top:7px;line-height:1.6">${h.desc} 房间配备Wi‑Fi、空调、独立卫浴，部分房型拥有观景窗。</div></div><div class="sectitle"><h2>选择房型</h2><span>${state.inDate}—${state.outDate}</span></div>${h.rooms.map((r,i)=>`<div class="room"><img src="${img(r[3])}"><div class="roommain"><div class="roomname">${r[0]}</div><div class="roomdesc">${r[1]}</div><div class="tags"><span>免费取消</span><span>Wi‑Fi</span><span>空调</span><span>独立卫浴</span></div><div class="roomprice"><b>¥${r[2]}</b><small>/晚</small><button class="bookbtn" onclick="book('${h.name}','${r[0]}',${r[2]})">预订</button></div></div></div>`).join('')}</div>`;page('detail')}
function book(hotel,room,price){let o={id:'WX'+Date.now().toString().slice(-6),hotel,room,price,total:price*state.nights,status:'待确认',date:state.inDate+'—'+state.outDate};let orders=JSON.parse(localStorage.getItem('wxorders')||'[]');orders.unshift(o);localStorage.setItem('wxorders',JSON.stringify(orders));toast('预订已提交，进入订单');setTimeout(renderOrders,500)}
function renderOrders(){let orders=JSON.parse(localStorage.getItem('wxorders')||'[]');document.getElementById('orders').innerHTML=`<div class="subbar"><button class="back" onclick="renderHome()">‹</button><h3>我的订单</h3></div>${orders.length?orders.map(o=>`<div class="orderCard"><span class="status">${o.status}</span><b>${o.hotel}</b><div style="font-size:12px;color:#777;margin:8px 0">${o.room} · ${o.date}</div><div><b style="color:#f15f27">¥${o.total}</b><span style="float:right;color:#999">订单号 ${o.id}</span></div></div>`).join(''):`<div class="empty">还没有订单<br><button class="primary" style="padding:9px 16px;border-radius:8px;margin-top:14px" onclick="renderHome()">去挑选住宿</button></div>`}${bottom('orders')}`;page('orders')}
function renderMerchant(){let orders=JSON.parse(localStorage.getItem('wxorders')||'[]');document.getElementById('merchant').innerHTML=`<div class="subbar"><button class="back" onclick="renderHome()">‹</button><h3>商家演示后台</h3></div><div class="merchant"><div class="stat"><div><small>今日订单</small><br><b>${orders.length}</b></div><div><small>待确认</small><br><b>${orders.filter(o=>o.status==='待确认').length}</b></div><div><small>房源</small><br><b>${hotels.length}</b></div></div><div class="panel"><b>订单管理</b><table><tr><th>酒店</th><th>房型</th><th>金额</th><th>状态</th></tr>${orders.map(o=>`<tr><td>${o.hotel.slice(0,7)}</td><td>${o.room.slice(0,7)}</td><td>¥${o.total}</td><td><button class="tinyBtn" onclick="confirmOrder('${o.id}')">${o.status==='待确认'?'确认':'已确认'}</button></td></tr>`).join('')||'<tr><td colspan=4>暂无订单</td></tr>'}</table></div><div class="panel"><b>房型价格（演示）</b>${hotels.slice(0,4).map(h=>`<div style="padding:11px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span>${h.name}</span><b style="color:#f15f27">¥${h.price}起</b></div>`).join('')}</div></div>`;page('merchant')}
function confirmOrder(id){let a=JSON.parse(localStorage.getItem('wxorders')||'[]');a=a.map(o=>o.id===id?{...o,status:'已确认'}:o);localStorage.setItem('wxorders',JSON.stringify(a));renderMerchant();toast('订单已确认')}
function openCal(){pendingIn=30;pendingOut=31;document.getElementById('calendarModal').classList.add('show');drawCal()}
function drawCal(){let days=['日','一','二','三','四','五','六'];let html='<div class="calendar">'+days.map(d=>`<div class="week">${d}</div>`).join('');for(let i=1;i<=31;i++){let cls=(i===pendingIn||i===pendingOut)?'day picked':'day';html+=`<div class="${cls}" onclick="pickDay(${i})">${i}</div>`}html+='</div><p style="font-size:12px;color:#888">请选择入住与退房日期</p>';document.getElementById('cal').innerHTML=html}
function pickDay(d){if(d<=30)pendingIn=d;else pendingOut=d; if(d===30)pendingOut=31; drawCal()}
function applyDates(){state.inDate='08月'+String(pendingIn).padStart(2,'0')+'日';state.outDate='08月'+String(pendingOut).padStart(2,'0')+'日';state.nights=Math.max(1,pendingOut-pendingIn);closeCal();renderHome()}
function closeCal(){document.getElementById('calendarModal').classList.remove('show')}
function openGuest(){document.getElementById('guestModal').classList.add('show')}
function applyGuest(){state.guest=document.getElementById('rooms').value+' '+document.getElementById('adults').value+' '+document.getElementById('kids').value;document.getElementById('guestModal').classList.remove('show');renderHome()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
renderHome();
// 长按/菜单入口：连续点击右上角菜单可打开商家演示后台
setTimeout(()=>{let d=document.querySelector('.dots');if(d)d.onclick=renderMerchant},100);
</script></body></html>
